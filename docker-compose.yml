services:
  ssl-checker:
    image: ghcr.io/wimb0/ssl-checker:latest
    image: ghcr.io/YOUR-GITHUB-USERNAME/ssl-monitor:latest
    # To build locally instead of pulling from GitHub: remove the line above and use:
    # build: .
    container_name: ssl-checker
    restart: unless-stopped

    # Run as your own user so the files in ./data belong to you, not to root
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      # Only reachable from the host itself by default (for use behind a reverse proxy).
      # Set BIND=0.0.0.0 in .env to make it available on your network.
      - "${BIND:-127.0.0.1}:${PORT:-3082}:3082"

    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      AUTH_USER: ${AUTH_USER:?Set AUTH_USER in .env}
      AUTH_PASS: ${AUTH_PASS:?Set AUTH_PASS in .env}

      # Email (SMTP). Configured here / in .env only, not in the web interface.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-}      # starttls | ssl | none (default: ssl on port 465, else starttls)
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

    volumes:
      - ./ssl-checker:/data                 # data.json + history.jsonl
